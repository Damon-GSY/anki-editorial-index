<!doctype html>
<html lang="zh-CN" data-mistline-context="deck-browser" data-mistline-motion="on" data-mistline-glass="off">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editorial Index production CSS fixture</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { min-height: 100%; }
    * { box-sizing: content-box; }
    body { margin: 2em; color: var(--fg); background: var(--canvas); }
    button {
      margin: 0 4px;
      padding: 8px 10px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--border-radius);
      outline: none !important;
      color: var(--fg);
      background: var(--button-bg);
      font-weight: 500;
    }

    /* Relevant Anki 26.5b1 contracts, kept before the add-on stylesheet. */
    :root[data-mistline-context="deck-browser"] body { margin: 2em 1em 1em; user-select: none; }
    :root[data-mistline-context="deck-browser"] table { padding: 1rem; }
    :root[data-mistline-context="deck-browser"] th { padding-bottom: 5px; border-bottom: 1px solid var(--border-subtle); }
    :root[data-mistline-context="deck-browser"] td { white-space: nowrap; }
    :root[data-mistline-context="deck-browser"] tr.deck td { padding: 1px 12px; border-bottom: 1px solid var(--border-subtle); }
    :root[data-mistline-context="deck-browser"] .decktd { min-width: 15em; max-width: calc(100vw - 300px); overflow: hidden; }
    :root[data-mistline-context="deck-browser"] .count { min-width: 4em; text-align: right; }
    :root[data-mistline-context="deck-browser"] .optscol { width: 2em; }
    :root[data-mistline-context="deck-browser"] .collapse { display: inline-block; width: 1em; }
    :root[data-mistline-context="deck-browser"] .gears { display: inline-block; width: 1em; height: 1em; opacity: .5; }
    :root[data-mistline-context="deck-browser"] #studiedToday { margin: 2em 0; }

    :root[data-mistline-context="overview"] h3 { margin-bottom: 0; }
    :root[data-mistline-context="overview"] .descfont { padding: 1em; }
    :root[data-mistline-context="overview"] .description { white-space: pre-wrap; }
    :root[data-mistline-context="overview"] .descmid { width: 70%; margin: 0 auto; text-align: left; }
    .streak { margin-top: .5em; }
    .streak-info { margin-left: 1em; }

    :root[data-mistline-context="top-toolbar"] body { margin: 0; padding: 0; overflow: hidden; user-select: none; }
    :root[data-mistline-context="top-toolbar"] .header { display: grid; grid-template-columns: repeat(3, 1fr); align-items: start; }
    :root[data-mistline-context="top-toolbar"] .left-tray { justify-self: start; }
    :root[data-mistline-context="top-toolbar"] .right-tray { justify-self: end; }
    :root[data-mistline-context="top-toolbar"] .toolbar { justify-self: center; white-space: nowrap; }
    :root[data-mistline-context="top-toolbar"] .hitem { display: inline-block; padding: 5px 12px; font-weight: 700; }
    :root[data-mistline-context="top-toolbar"] body.fancy .toolbar { overflow: hidden; border-radius: 0 0 12px 12px; background: var(--canvas-glass); box-shadow: 0 2px 3px rgba(20,20,20,.1); }
    :root[data-mistline-context="top-toolbar"] body.fancy:not(.flat) .hitem { border: 1px solid transparent; background: var(--canvas-glass); }
    :root[data-mistline-context="top-toolbar"] body.fancy .hitem:first-child { padding-left: 18px; }
    :root[data-mistline-context="top-toolbar"] body.fancy .hitem:last-child { padding-right: 18px; }
    :root[data-mistline-context="top-toolbar"] #sync-spinner { width: 0; height: 16px; margin-bottom: -3px; visibility: hidden; }
    :root[data-mistline-context="top-toolbar"] #sync-spinner.spin { width: 16px; visibility: visible; }

    :root[data-mistline-context="reviewer-bottom-bar"] body { margin: 0; padding: 0; overflow: hidden; user-select: none; }
    :root[data-mistline-context="reviewer-bottom-bar"] #outer { border-top: 1px solid var(--border); }
    :root[data-mistline-context="reviewer-bottom-bar"] #innertable { width: 100%; border-spacing: 0; }
    :root[data-mistline-context="reviewer-bottom-bar"] #middle td[align="center"] { position: relative; padding-top: 10px; }
    :root[data-mistline-context="reviewer-bottom-bar"] button { position: relative; min-width: 60px; margin: 9px; white-space: nowrap; }
    :root[data-mistline-context="reviewer-bottom-bar"] .stat { padding-top: 10px; }
    :root[data-mistline-context="reviewer-bottom-bar"] .stat2 { padding-top: 10px; font-weight: 400; }
    :root[data-mistline-context="reviewer-bottom-bar"] .nobold,
    :root[data-mistline-context="reviewer-bottom-bar"] .stattxt { position: absolute; top: -3px; left: 50%; transform: translate(-50%, -100%); display: inline-block; white-space: nowrap; font-size: small; font-weight: 400; }
    :root[data-mistline-context="standard-bottom-bar"] body { margin: 0; padding: 0; overflow: hidden; user-select: none; }
    :root[data-mistline-context="standard-bottom-bar"] #header { border-bottom: 0; margin-top: 0; padding: 9px; }
    .card { color: rgb(41, 73, 105); font-family: Arial, sans-serif; line-height: 2; }
    .card-content { text-align: center; }
    .card-content h1 { max-width: 26ch; margin: 0 auto 48px; font: 600 clamp(36px, 4.6vw, 52px)/1.12 var(--mist-serif); letter-spacing: -.025em; text-wrap: balance; }
    .card-content p { margin: 0; font: 600 clamp(28px, 3.2vw, 38px)/1.18 var(--mist-serif); }
    .user-card-button { margin-top: 24px; padding: 7px 13px; border: 3px dotted rgb(126, 53, 91); border-radius: 19px; color: rgb(88, 36, 66); background: rgb(252, 224, 238); box-shadow: 4px 5px 0 rgb(88, 36, 66); font-family: Georgia, serif; font-weight: 400; animation: user-card-pulse 3s infinite; transition: opacity 2s; }
    .user-card-button:active { transform: scale(.92); }
    .user-card-inheritance-probe { font-size: 23px; }
    @keyframes user-card-pulse { 50% { opacity: .82; } }
    .fixture-label { position: fixed; z-index: 5; right: 16px; bottom: 14px; color: var(--mist-muted); font: 11px var(--mist-sans); }
    .fixture-label { pointer-events: none; }
    @media (max-width: 583px) { :root[data-mistline-context="reviewer-bottom-bar"] .stat { display: none; } }
    @media (max-width: 480px) { .fixture-label { display: none; } }
  </style>
  <link rel="stylesheet" href="/addon/web/theme.css?v=01A-R7">
</head>
<body></body>
<script>
  const params = new URLSearchParams(location.search);
  const context = params.get("context") || "deck-browser";
  const darkMode = params.get("theme") === "dark";
  const motion = params.get("motion") === "off" ? "off" : "on";
  const answer = params.get("state") === "answer";
  const standardVariant = ["deck", "overview", "dynamic"].includes(params.get("variant")) ? params.get("variant") : "deck";
  const requestedRatings = Number(params.get("ratings") || 4);
  const ratingCount = [2, 3, 4].includes(requestedRatings) ? requestedRatings : 4;
  const syncActive = params.get("sync") === "1";
  const toolbarLabels = params.get("labels") === "long"
    ? { decks: "Stapelübersicht", add: "Hinzufügen", browse: "Durchsuchen", stats: "Statistiken", sync: "Synchronisieren" }
    : { decks: "Decks", add: "Add", browse: "Browse", stats: "Stats", sync: "Sync" };
  document.documentElement.dataset.mistlineContext = context;
  document.documentElement.dataset.mistlineMotion = motion;
  document.documentElement.classList.toggle("night-mode", darkMode);
  document.documentElement.dataset.fixtureVariant = standardVariant;
  document.documentElement.dataset.fixtureRatings = String(ratingCount);
  document.documentElement.dataset.fixtureSync = syncActive ? "active" : "idle";

  const deckRows = `
    <tr class="deck"><td class="decktd" colspan="5"><a class="collapse" href="#">−</a><a class="deck" href="#">LANGUAGES / 语言</a></td><td align="end"><span class="new-count">124</span></td><td align="end"><span class="learn-count">48</span></td><td align="end"><span class="review-count">156</span></td><td class="opts" align="center"><span class="gears">⚙</span></td></tr>
    <tr class="deck"><td class="decktd" colspan="5">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a class="collapse" href="#">−</a><a class="deck" href="#">English</a></td><td align="end"><span class="new-count">62</span></td><td align="end"><span class="learn-count">24</span></td><td align="end"><span class="review-count">78</span></td><td class="opts" align="center"><span class="gears">⚙</span></td></tr>
    <tr class="deck"><td class="decktd" colspan="5">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="collapse"></span><a class="deck" href="#">Academic Vocabulary</a></td><td align="end"><span class="new-count">12</span></td><td align="end"><span class="learn-count">8</span></td><td align="end"><span class="review-count">34</span></td><td class="opts" align="center"><span class="gears">⚙</span></td></tr>
    <tr class="deck"><td class="decktd" colspan="5">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="collapse"></span><a class="deck" href="#">日本語</a></td><td align="end"><span class="new-count">50</span></td><td align="end"><span class="learn-count">16</span></td><td align="end"><span class="review-count">44</span></td><td class="opts" align="center"><span class="gears">⚙</span></td></tr>
    <tr class="deck"><td class="decktd" colspan="5"><a class="collapse" href="#">−</a><a class="deck" href="#">MEDICINE / 医学</a></td><td align="end"><span class="new-count">88</span></td><td align="end"><span class="learn-count">35</span></td><td align="end"><span class="review-count">112</span></td><td class="opts" align="center"><span class="gears">⚙</span></td></tr>
    <tr class="deck current"><td class="decktd" colspan="5">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="collapse"></span><a class="deck" href="#">Anatomy</a></td><td align="end"><span class="new-count">28</span></td><td align="end"><span class="learn-count">14</span></td><td align="end"><span class="review-count">57</span></td><td class="opts" align="center"><span class="gears">⚙</span></td></tr>
    <tr class="deck"><td class="decktd" colspan="5"><a class="collapse" href="#">−</a><a class="deck" href="#">DESIGN / 设计</a></td><td align="end"><span class="new-count">53</span></td><td align="end"><span class="learn-count">18</span></td><td align="end"><span class="review-count">71</span></td><td class="opts" align="center"><span class="gears">⚙</span></td></tr>
    <tr class="deck"><td class="decktd" colspan="5">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="collapse"></span><a class="deck" href="#">Typography</a></td><td align="end"><span class="new-count">21</span></td><td align="end"><span class="learn-count">8</span></td><td align="end"><span class="review-count">29</span></td><td class="opts" align="center"><span class="gears">⚙</span></td></tr>`;

  const heatmapView = context === "deck-browser" ? "rh-view-deckbrowser" : "rh-view-overview";
  const heatmapCellColors = darkMode
    ? ["rgb(92, 174, 76)", "rgb(116, 186, 88)", "rgb(214, 230, 133)"]
    : ["rgb(116, 186, 88)", "rgb(92, 174, 76)", "rgb(30, 104, 35)"];
  const heatmapStats = `<div class="rh-container rh-theme-lime ${heatmapView}"><div class="heatmap" aria-label="Review calendar"><span class="day rh-col15" data-expected-background="${heatmapCellColors[0]}"></span><span class="day rh-col16" data-expected-background="${heatmapCellColors[1]}"></span><span class="day rh-col20" data-expected-background="${heatmapCellColors[2]}"></span></div><div class="streak"><span class="streak-info">Daily average:</span> <span class="sstats rh-col15">55 cards</span><span class="streak-info">Days learned:</span> <span class="sstats rh-col16">83%</span><span class="streak-info">Longest streak:</span> <span class="sstats rh-col20">293 days</span><span class="streak-info">Current streak:</span> <span class="sstats rh-col0">0 day</span></div></div>`;
  const deck = `<center><section class="mistline-deck-heading" data-mistline-owned="deck-heading"><h1>Deck Home</h1><p>Memory index</p></section><table cellspacing="0" cellpadding="3"><thead><tr><th colspan="5" align="start">Deck</th><th class="count">New</th><th class="count">Learn</th><th class="count">Due</th><th class="optscol"></th></tr></thead><tbody>${deckRows}</tbody></table><div id="studiedToday">126 cards studied today · 24 minutes</div>${heatmapStats}</center>`;
  const toolbar = `<div class="header"><div class="left-tray"></div><nav class="toolbar"><a class="hitem" tabindex="-1" aria-label="${toolbarLabels.decks}" title="${toolbarLabels.decks}" id="decks" href="#">${toolbarLabels.decks}</a><a class="hitem" tabindex="-1" aria-label="${toolbarLabels.add}" title="${toolbarLabels.add}" id="add" href="#">${toolbarLabels.add}</a><a class="hitem" tabindex="-1" aria-label="${toolbarLabels.browse}" title="${toolbarLabels.browse}" id="browse" href="#">${toolbarLabels.browse}</a><a class="hitem" tabindex="-1" aria-label="${toolbarLabels.stats}" title="${toolbarLabels.stats}" id="stats" href="#">${toolbarLabels.stats}</a><a class="hitem" tabindex="-1" aria-label="${toolbarLabels.sync}" title="${toolbarLabels.sync}" id="sync" href="#">${toolbarLabels.sync}<img id="sync-spinner" class="${syncActive ? "spin" : ""}" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23808080' d='M18 13.5h10.75V2.67zM24.9 19.78a8.9 8.9 0 0 1-8.32 5.49 9.13 9.13 0 1 1 6.51-15.6l2.6-3.05a13 13 0 1 0 2.74 13.16z'/%3E%3C/svg%3E"></a></nav><div class="right-tray"></div></div>`;
  const overview = `<center><h3>Anatomy</h3><div class="descfont descmid description"><p><span class="new-count">28 new</span> · <span class="learn-count">14 learning</span> · <span class="review-count">57 due</span></p><p>126 cards studied today · 24 minutes</p></div><table width="400" cellpadding="5"><tr><td align="center" valign="top"><table cellspacing="5"><tr><td>New:</td><td><b><span class="new-count">28</span></b></td></tr><tr><td>Learning:</td><td><b><span class="learn-count">14</span></b></td></tr><tr><td>To Review:</td><td><b><span class="review-count">57</span></b></td></tr></table></td><td align="center"><button id="study" autofocus>Study Now</button></td></tr></table>${heatmapStats}</center>`;
  const reviewer = `<div id="qa"><div class="card-content"><h1>Which valve lesion produces a holosystolic murmur radiating to the axilla?</h1>${answer ? "<p>Mitral regurgitation</p>" : ""}<span class="user-card-inheritance-probe">User-owned inherited typography</span><button class="user-card-button" type="button">User card action</button></div></div>`;
  const ratingPresets = {
    2: [[1, "Again", "20m"], [2, "Good", "3mo"]],
    3: [[1, "Again", "20m"], [2, "Good", "3mo"], [3, "Easy", "3mo"]],
    4: [[1, "Again", "20m"], [2, "Hard", "3mo"], [3, "Good", "3mo"], [4, "Easy", "3mo"]],
  };
  const answerButtons = `<center><table cellpadding="0" cellspacing="0"><tr>${ratingPresets[ratingCount].map(([ease, label, interval]) => `<td align="center"><button ${ease === 3 ? 'id="defease" ' : ""}data-ease="${ease}" data-rating-label="${label}">${label}<span class="nobold">${interval}</span></button></td>`).join("")}</tr></table></center>`;
  const questionButton = `<table cellpadding="0"><tr><td class="stat2" align="center"><button id="ansbut">Show Answer<span class="stattxt">12 + 7 + 36</span></button></td></tr></table>`;
  const rating = `<center id="outer"><table id="innertable" width="100%" cellspacing="0" cellpadding="0"><tr><td class="stat" align="start" valign="top"><button>Edit</button></td><td id="middle" align="center" valign="top">${answer ? answerButtons : questionButton}</td><td class="stat" align="end" valign="top"><button>More&nbsp;⌄<span id="time" class="stattxt">0:12</span></button></td></tr></table></center>`;
  const standardActions = {
    deck: [["shared", "Get Shared"], ["create", "Create Deck"], ["import", "Import File"]],
    overview: [["opts", "Options"], ["studymore", "Custom Study"], ["unbury", "Unbury"], ["description", "Description"]],
    dynamic: [["opts", "Options"], ["refresh", "Rebuild"], ["empty", "Empty"], ["unbury", "Unbury"]],
  };
  const standardBottom = `<center id="outer"><table width="100%" id="header"><tr><td align="center">${standardActions[standardVariant].map(([action, label]) => `<button data-action="${action}">${label}</button>`).join("")}</td></tr></table></center>`;

  if (context === "deck-browser") document.body.innerHTML = deck;
  if (context === "top-toolbar") { document.body.className = "fancy"; document.body.innerHTML = toolbar; }
  if (context === "overview") document.body.innerHTML = overview;
  if (context === "reviewer") { document.body.className = "card"; document.body.innerHTML = reviewer; }
  if (context === "reviewer-bottom-bar") document.body.innerHTML = rating;
  if (context === "standard-bottom-bar") document.body.innerHTML = standardBottom;
  const fixtureState = [answer ? "answer" : "question", context === "standard-bottom-bar" ? standardVariant : "", context === "reviewer-bottom-bar" && answer ? `${ratingCount} ratings` : "", context === "top-toolbar" && syncActive ? "syncing" : ""].filter(Boolean).join(" · ");
  document.body.insertAdjacentHTML("beforeend", `<span class="fixture-label">${context} · ${fixtureState}</span>`);

  // Review Heatmap injects its stylesheet after Anki and add-on styles. Keep
  // this fixture late and deliberately forceful so the compatibility contract
  // is tested against the real load order without recoloring calendar cells.
  if (context === "deck-browser" || context === "overview") {
    const reviewHeatmapStyle = document.createElement("style");
    reviewHeatmapStyle.id = "review-heatmap-late-style";
    reviewHeatmapStyle.textContent = `
      .rh-container .heatmap { display: flex; justify-content: center; gap: 4px; margin-top: 12px; }
      .rh-container .day { display: inline-block; width: 12px; height: 12px; border-radius: 2px; }
      .sstats { color: #e6e6e6 !important; font-weight: bold; }
      .rh-theme-lime .rh-col15 { color: #74ba58 !important; }
      .rh-theme-lime .rh-col16 { color: #5cae4c !important; }
      .rh-theme-lime .rh-col20 { color: #1e6823 !important; }
      .rh-theme-lime .day.rh-col15 { background-color: #74ba58 !important; }
      .rh-theme-lime .day.rh-col16 { background-color: #5cae4c !important; }
      .rh-theme-lime .day.rh-col20 { background-color: #1e6823 !important; }
      .night-mode .rh-theme-lime .rh-col15 { color: #5cae4c !important; }
      .night-mode .rh-theme-lime .rh-col16 { color: #74ba58 !important; }
      .night-mode .rh-theme-lime .rh-col20 { color: #d6e685 !important; }
      .night-mode .rh-theme-lime .day.rh-col15 { background-color: #5cae4c !important; }
      .night-mode .rh-theme-lime .day.rh-col16 { background-color: #74ba58 !important; }
      .night-mode .rh-theme-lime .day.rh-col20 { background-color: #d6e685 !important; }
    `;
    document.head.append(reviewHeatmapStyle);
  }
</script>
</html>
