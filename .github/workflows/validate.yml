name: Validate add-on

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build package
        run: python3 scripts/package_addon.py
      - name: Validate package
        run: python3 scripts/validate_addon.py
      - name: Check Editor bootstrap syntax
        run: node --check addon/web/editor-marker.js
      - name: Run hook smoke test
        run: python3 scripts/smoke_test_addon.py
      - name: Test reversible native theme
        run: python3 scripts/test_native_theme.py
      - name: Install visual test runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run UI regression matrix
        run: npm run test:ui
      - name: Save installable package
        uses: actions/upload-artifact@v7
        with:
          name: Editorial-Index
          path: |
            dist/Editorial-Index.ankiaddon
            dist/SHA256SUMS
