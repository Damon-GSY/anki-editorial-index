name: Validate add-on

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package
        run: python3 scripts/package_addon.py
      - name: Validate package
        run: python3 scripts/validate_addon.py
      - name: Run hook smoke test
        run: python3 scripts/smoke_test_addon.py
      - name: Save installable package
        uses: actions/upload-artifact@v4
        with:
          name: Editorial-Index
          path: |
            dist/Editorial-Index.ankiaddon
            dist/SHA256SUMS
