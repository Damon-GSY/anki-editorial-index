name: Bug report
description: Report an interface, installation, or compatibility problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Editorial Index. Remove private card content and account information from screenshots.
  - type: input
    id: anki-version
    attributes:
      label: Anki version
      placeholder: 26.08.1
    validations:
      required: true
  - type: input
    id: addon-version
    attributes:
      label: Editorial Index version
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Anki appearance
      options:
        - Light
        - Dark
        - Both
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Explain what you saw and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Anki
        2. Go to ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: other-addons
    attributes:
      label: Other interface add-ons
      description: List other enabled themes or UI add-ons, or write None.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag in a full-window screenshot with private card content removed.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I restarted Anki after installing or updating the add-on.
          required: true
        - label: I checked the troubleshooting guide.
          required: true
